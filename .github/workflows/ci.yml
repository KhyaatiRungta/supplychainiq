name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  validate:
    name: Validate scripts
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Byte-compile every script
        run: python -m compileall -q scripts

      - name: Check each script parses and declares a main guard
        run: |
          python - <<'PY'
          import ast
          import pathlib
          import sys

          failures = []
          for path in sorted(pathlib.Path("scripts").glob("*.py")):
              source = path.read_text(encoding="utf-8")
              try:
                  tree = ast.parse(source, filename=str(path))
              except SyntaxError as exc:
                  failures.append(f"{path}: syntax error ({exc})")
                  continue

              imports = sorted({
                  alias.name.split(".")[0]
                  for node in ast.walk(tree)
                  if isinstance(node, ast.Import)
                  for alias in node.names
              } | {
                  node.module.split(".")[0]
                  for node in ast.walk(tree)
                  if isinstance(node, ast.ImportFrom) and node.module
              })
              third_party = sorted(set(imports) - set(sys.stdlib_module_names))
              print(f"ok   {path.name:32} third-party: {third_party or 'none'}")

          if failures:
              print("\n".join(failures))
              sys.exit(1)
          PY

      - name: Confirm large data stays out of the repository
        run: |
          git ls-files -- 'data/**/*.csv' | tee /tmp/tracked-csv.txt
          if [ -s /tmp/tracked-csv.txt ]; then
            echo "::error::CSV extracts are tracked but should be gitignored."
            exit 1
          fi
          echo "No CSV extracts tracked."
